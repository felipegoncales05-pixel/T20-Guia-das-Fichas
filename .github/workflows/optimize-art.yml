name: Otimizar ilustrações para celular
on:
  push:
    branches: [main]
    paths:
      - 'assets/art/**'
      - '.github/workflows/optimize-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Converter PNG em WebP comprimido
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          source=Path('assets/art')
          output=Path('assets/art-optimized')
          output.mkdir(parents=True,exist_ok=True)
          for path in sorted(source.glob('*.png')):
              im=ImageOps.exif_transpose(Image.open(path))
              im.thumbnail((720,960),Image.Resampling.LANCZOS)
              if im.mode not in ('RGB','RGBA'): im=im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              target=output/(path.stem+'.webp')
              im.save(target,'WEBP',quality=78,method=6)
              print(f'{path.name}: {path.stat().st_size} bytes -> {target.stat().st_size} bytes')
          PY
      - name: Publicar WebP locais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art-optimized/
          if ! git diff --cached --quiet; then
            git commit -m "assets: gerar WebP responsivos para artes enviadas"
            git push
          fi
