name: Publicar O Sistema no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "github-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar scripts e dados
        run: |
          node --check data.js
          node --check app.js
          node tests/site-smoke.cjs
      - name: Montar site estático
        run: |
          mkdir -p _site
          cp index.html styles.css data.js app.js _site/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        uses: actions/deploy-pages@v4
