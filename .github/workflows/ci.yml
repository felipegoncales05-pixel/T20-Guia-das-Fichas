name: Validar fichas e interface
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe
        run: |
          node --check data.js
          node --check guide.js
          node --check rentarou-guide.js
          node --check expansion.js
          node --check expansion-runtime.js
          node --check app.js
          node --check tests/site-smoke.cjs
          node --check tests/browser-lite.cjs
      - name: Validar as doze fichas
        run: |
          node tests/site-smoke.cjs
          node tests/browser-lite.cjs

  mobile:
    name: Validar celular e tablet (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador de teste
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verificar onze tamanhos de tela
        run: node tests/responsive-browser.cjs
      - name: Anexar capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsivo-capturas
          path: tests/screenshots/
          if-no-files-found: ignore
